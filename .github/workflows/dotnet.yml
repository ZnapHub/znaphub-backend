name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore src/ZnapHub.Api/ZnapHub.Api.csproj
    
    - name: Build
      run: dotnet build src/ZnapHub.Api/ZnapHub.Api.csproj --no-restore
    
    - name: Test
      run: dotnet test src/ZnapHub.Api/ZnapHub.Api.csproj --no-build --verbosity normal
