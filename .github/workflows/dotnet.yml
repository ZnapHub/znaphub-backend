name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Debug - List files
      run: |
        echo "=== Root directory ==="
        ls -la
        echo "=== src directory ==="
        ls -la src/
        echo "=== Checking for .csproj files ==="
        find . -name "*.csproj" -type f

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Check solution file
      run: |
        echo "=== Solution file content ==="
        head -50 ZnapHub.sln || echo "Solution file not found"
