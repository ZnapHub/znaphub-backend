name: Deploy with azure/k8s-deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: awingray/znaphub-api
  K8S_NAMESPACE: znaphub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build and push Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.IMAGE_NAME }}:latest

