apiVersion: apps/v1
kind: Deployment
metadata:
  name: znaphub-api
  namespace: znaphub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: znaphub-api
  template:
    metadata:
      labels:
        app: znaphub-api
    spec:
      containers:
        - name: api
          image: awingray/znaphub-api:latest
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__ZnapHubContext
              valueFrom:
                secretKeyRef:
                  name: znaphub-secrets
                  key: CONNECTIONSTRING_ZNAPHUB_API
            - name: Authentication__Authority
              valueFrom:
                secretKeyRef:
                  name: znaphub-secrets
                  key: AUTHENTICATION_AUTHORITY
            - name: Storage__Cloudflare__AccessKey
              valueFrom:
                secretKeyRef:
                  name: znaphub-secrets
                  key: STORAGE_ACCESS_KEY
            - name: Storage__Cloudflare__Endpoint
              valueFrom:
                secretKeyRef:
                  name: znaphub-secrets
                  key: STORAGE_ENDPOINT
            - name: Storage__Cloudflare__SecretKey
              valueFrom:
                secretKeyRef:
                  name: znaphub-secrets
                  key: STORAGE_SECRET_KEY
            - name: Authentication__Audience
              value: "znaphub-api"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: znaphub-api
  namespace: znaphub
spec:
  selector:
    app: znaphub-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081