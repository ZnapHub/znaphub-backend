apiVersion: v1
kind: ConfigMap
metadata:
  name: znaphub-config
  namespace: znaphub
data:
  appsettings.json: |
    {
      "ConnectionStrings": {
        "ZnapHubContext": "Host=postgres.znaphub.svc.cluster.local;Port=5432;Database=ZnapHub;Username=postgres;Password=postgrespw;Timeout=300;CommandTimeout=300"
      },
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "AllowedHosts": "*",
      "Minio": {
        "Endpoint": "minio.znaphub.svc.cluster.local:9000",
        "Secure": false,
        "Bucket": "eventphotos"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: znaphub-api
  namespace: znaphub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: znaphub-api
  template:
    metadata:
      labels:
        app: znaphub-api
    spec:
      containers:
        - name: znaphub-api
          image: awingray/znaphub-api:latest
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          volumeMounts:
            - name: app-config
              mountPath: /app/appsettings.json
              subPath: appsettings.json
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
      volumes:
        - name: app-config
          configMap:
            name: znaphub-config
            items:
              - key: appsettings.json
                path: appsettings.json
---
apiVersion: v1
kind: Service
metadata:
  name: znaphub-api
  namespace: znaphub
spec:
  selector:
    app: znaphub-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: znaphub-ingress
  namespace: znaphub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: znaphub.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: znaphub-api
                port:
                  number: 80