apiVersion: apps/v1
kind: Deployment
metadata:
  name: znaphub-api
  namespace: znaphub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: znaphub-api
  template:
    metadata:
      labels:
        app: znaphub-api
    spec:
      containers:
        - name: api
          image: awingray/znaphub:latest
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__ZnapHubContext
              value: "Host=znaphub-db;Port=5432;Database=ZnapHub;Username=postgres;Password=postgrespw;Timeout=300;CommandTimeout=300"
            - name: Authentication__Authority
              value: "https://auth.staging.znaphub.com/realms/znaphub"
            - name: Authentication__Audience
              value: "znaphub-api"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: znaphub-api
  namespace: znaphub
spec:
  selector:
    app: znaphub-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081